# ============================================================
# Wrangler Configuration for Wikipedia Proxy
# Deploy from GitHub with: npm run deploy
# ============================================================

name = "wiki-proxy"
main = "wiki-proxy.js"
compatibility_date = "2024-12-18"

# Account ID - set this in GitHub Secrets as CLOUDFLARE_ACCOUNT_ID
# Or uncomment and set directly:
# account_id = "your-account-id"

# ============================================================
# Variables
# ============================================================

[vars]
# No environment variables needed for basic proxy
# Add if you want to customize domains later

# ============================================================
# Environment-specific settings (optional)
# ============================================================

# Production environment
[env.production]
vars = { ENVIRONMENT = "production" }

# Staging/development environment
[env.staging]
vars = { ENVIRONMENT = "staging" }

# ============================================================
# Observability
# ============================================================

[observability]
logs = { enabled = true, retention_days = 7 }
traces = { enabled = true, capture = "all" }

# ============================================================
# Limits (optional, fine for free tier)
# ============================================================

# [limits]
# cpu_ms = 10
# memory_mb = 128

# ============================================================
# Routes (optional - bind custom domain)
# ============================================================

# Uncomment to route from a custom domain:
# [[routes]]
# pattern = "wiki.yourdomain.com/*"
# zone_id = "your-zone-id"

# ============================================================
# Triggers (for scheduled tasks - not needed for proxy)
# ============================================================

# [triggers]
# crons = []

# ============================================================
# D1 Database (not needed for proxy)
# ============================================================

# [[d1_databases]]
# binding = "DB"
# database_name = "my-database"
# database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# ============================================================
# R2 Bucket (optional for caching)
# ============================================================

# [[r2_buckets]]
# binding = "CACHE_BUCKET"
# bucket_name = "wiki-proxy-cache"
# ============================================================
